name: Build ArenaSystem Client-driven Assassin Off-hand

on:
  push:
    paths:
      - "ArenaSystem-Assassin-Sweep-0.2.8.12/**"
      - ".github/workflows/build-arena-system-assassin-sweep.yml"
  pull_request:
    paths:
      - "ArenaSystem-Assassin-Sweep-0.2.8.12/**"
      - ".github/workflows/build-arena-system-assassin-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Obtain matching Fabric client source and assemble bundle
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/au3891427-wq/proyek-arenasystem-plugin.git client-repository
          git -C client-repository checkout 5d101d9556e29dcd25c14652392c1c79be8e1889
          bundle="ArenaSystem-Client-Input-0.2.8.15-client-0.2.8"
          mkdir -p "$bundle"
          cp -R ArenaSystem-Assassin-Sweep-0.2.8.12/Server "$bundle/Server"
          cp -R client-repository/ArenaSystemClient "$bundle/Client"

      - name: Build Paper plugin with Maven
        run: mvn --batch-mode --no-transfer-progress -f ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Server/pom.xml package

      - name: Build Fabric client mod
        run: gradle --no-daemon -p ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Client clean build

      - name: Test companion handshake protocol
        shell: bash
        run: |
          set -euo pipefail
          project="ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Client"
          test_dir="${RUNNER_TEMP}/arenasystem-handshake-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" \
            "$project/src/main/java/id/hadziq/arenasystem/client/CompanionHandshakeProtocol.java" \
            "$project/tools/TestCompanionHandshakeProtocol.java"
          java -cp "$test_dir" id.hadziq.arenasystem.client.TestCompanionHandshakeProtocol

      - name: Test client skill input protocol
        shell: bash
        run: |
          set -euo pipefail
          project="ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Client"
          test_dir="${RUNNER_TEMP}/arenasystem-client-input-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" \
            "$project/src/main/java/id/hadziq/arenasystem/client/SkillInputProtocol.java" \
            "$project/tools/TestSkillInputProtocol.java"
          java -cp "$test_dir" id.hadziq.arenasystem.client.TestSkillInputProtocol

      - name: Test Paper skill input protocol
        shell: bash
        run: |
          set -euo pipefail
          project="ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Server"
          test_dir="${RUNNER_TEMP}/arenasystem-server-input-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" \
            "$project/src/main/java/id/hadziq/arenasystem/SkillInputProtocol.java" \
            "$project/tools/TestSkillInputProtocol.java"
          java -cp "$test_dir" id.hadziq.arenasystem.TestSkillInputProtocol

      - name: Verify discrete click input and PDC marker detection
        shell: bash
        run: |
          set -euo pipefail
          client="ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Client/src/main/java/id/hadziq/arenasystem/client"
          keybinds="$client/ArenaSystemKeybinds.java"
          offhand="$client/AssassinOffhandInputClient.java"
          grep -q 'primarySkillKey.consumeClick()' "$keybinds"
          grep -q 'secondarySkillKey.consumeClick()' "$keybinds"
          grep -q 'assassinOffhandClickKey.consumeClick()' "$keybinds"
          grep -q 'sniperAimLockKey.consumeClick()' "$keybinds"
          grep -q 'SkillInputProtocol.ACTION_SNIPER_AIM_LOCK' "$keybinds"
          grep -q 'InputConstants.MOUSE_BUTTON_RIGHT' "$keybinds"
          grep -q 'bukkitValues.contains(marker)' "$keybinds"
          ! grep -q 'get(marker) instanceof StringTag' "$keybinds"
          ! grep -q 'org.lwjgl.glfw' "$keybinds"
          ! grep -q 'SkillInputClient.send' "$offhand"

      - name: Verify keybind ownership stays on the client
        shell: bash
        run: |
          set -euo pipefail
          client="ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Client/src/main/java/id/hadziq/arenasystem/client"
          server="ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Server/src/main/java/id/hadziq/arenasystem"
          grep -q 'sniperAimLockKey.consumeClick()' "$client/ArenaSystemKeybinds.java"
          grep -q 'ACTION_SNIPER_AIM_LOCK' "$client/SkillInputProtocol.java"
          grep -q 'ACTION_SNIPER_AIM_LOCK' "$server/SkillInputProtocol.java"
          grep -q 'toggleSniperAimLock(player)' "$server/ClassAbilityListener.java"
          grep -q "^version: '0.2.8.15'$" "ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Server/src/main/resources/plugin.yml"
          ! grep -q 'onPrimarySkillKey' "$server/ClassAbilityListener.java"
          ! grep -q 'getCurrentInput()' "$server/ClassAbilityListener.java"
          python - "$server/ClassAbilityListener.java" <<'PY'
          import pathlib
          import sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          handler = source.split("public void onSkillItemDrop(", 1)[1].split(
              "public void onSniperShoot(", 1
          )[0]
          assert "sniperAimLocked.add(" not in handler
          assert "sniperAimLocked.remove(" not in handler
          PY

      - name: Package clean source ZIP
        run: |
          mkdir -p dist
          zip -r "dist/ArenaSystem-Client-Input-0.2.8.15-client-0.2.8-source.zip" "ArenaSystem-Client-Input-0.2.8.15-client-0.2.8" \
            -x "*/Server/target/*" "*/Client/build/*" "*/Client/.gradle/*"

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: ArenaSystem-Client-Input-0.2.8.15-client-0.2.8-source
          path: dist/ArenaSystem-Client-Input-0.2.8.15-client-0.2.8-source.zip
          if-no-files-found: error

      - name: Upload validated JARs
        uses: actions/upload-artifact@v4
        with:
          name: ArenaSystem-Client-Input-0.2.8.15-client-0.2.8-jars
          path: |
            ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Server/target/arenaSystem_Bukkit-0.2.8.15.jar
            ArenaSystem-Client-Input-0.2.8.15-client-0.2.8/Client/build/libs/ArenaSystem_Client-0.2.8.jar
          if-no-files-found: error
