name: Build ArenaSystem Paper Server

on:
  push:
    paths:
      - "pom.xml"
      - "src/**"
      - "tools/**"
      - ".github/workflows/build-paper-server.yml"
  pull_request:
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/build-paper-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build Paper plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Test skill input protocol
        run: |
          test_dir="$RUNNER_TEMP/arenasystem-skill-input-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" src/main/java/id/hadziq/arenasystem/SkillInputProtocol.java tools/TestSkillInputProtocol.java
          java -cp "$test_dir" id.hadziq.arenasystem.TestSkillInputProtocol
      - name: Upload Paper plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArenaSystem-Paper-0.2.8.11
          path: target/arenaSystem_Bukkit-0.2.8.11.jar
          if-no-files-found: error
          retention-days: 30
